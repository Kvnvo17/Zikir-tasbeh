services:
  - type: web
    name: zikr-tasbeh
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zikr-tasbeh-db
          property: connectionString
      - key: WEBAPP_URL
        sync: false
      - key: TUTORIAL_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: SUPER_ADMIN_IDS
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: BOT_MODE
        value: polling
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true

databases:
  - name: zikr-tasbeh-db
    plan: starter
    databaseName: zikr_tasbeh
    user: zikr_tasbeh_user
